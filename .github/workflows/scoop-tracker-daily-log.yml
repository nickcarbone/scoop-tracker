name: Scoop Tracker — Daily Log

on:
  schedule:
    # Once/day, 23:50 UTC -- deliberately just before midnight rollover, and
    # after the day's last 4-hourly pipeline run (scoop-tracker.yml runs at
    # 00/04/08/12/16/20 UTC), so this captures as much of the day as possible.
    - cron: "50 23 * * *"
  workflow_dispatch: {}   # manual trigger from the Actions tab

concurrency:
  group: scoop-tracker-daily-log
  cancel-in-progress: false

permissions:
  contents: write   # commit the daily .docx back, and read the db-store release

jobs:
  build-log:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Reads the newest snapshot scoop-tracker.yml uploaded to the "db-store"
      # release. This job never re-fetches feeds, which keeps it cheap. Bootstrap
      # is disabled: only the main pipeline may seed the store, so this fails
      # loudly instead if no snapshot exists.
      - name: Download database
        run: bash scripts/db_store.sh pull
        env:
          DB_STORE_NO_BOOTSTRAP: "1"

      # daily_log.py exits non-zero if the newest pipeline run is >12h old,
      # rather than writing an empty log (see the 7-10 Oct 2026 outage).
      - name: Build daily log
        run: >
          python3 daily_log.py
          --db scoop_tracker.db
          --window-hours 24
          --per-source-cap 8
          --top-n-per-bucket 20

      - name: Timestamp for commit message
        run: echo "RUN_DATE=$(date -u +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Commit daily log
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Daily scoop log: ${{ env.RUN_DATE }}"
          file_pattern: "daily_logs/*.docx"
          commit_user_name: "scoop-tracker-bot"
          commit_user_email: "actions@users.noreply.github.com"
