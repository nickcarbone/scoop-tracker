name: Scoop Tracker

on:
  schedule:
    # Every 4 hours. Deliberately not more frequent than that — this hits the
    # same ~75 outlets repeatedly, and the enrichment step fetches full article
    # pages on top of the RSS pull. Caching (skip re-fetch for known URLs) keeps
    # each run's marginal footprint small, but the schedule itself should stay
    # conservative rather than relying on caching alone to be polite.
    - cron: "0 */4 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

concurrency:
  group: scoop-tracker-run
  cancel-in-progress: false   # let a running job finish rather than corrupting the db mid-write

permissions:
  contents: write   # commit the report back, and read/write the db-store release

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The database lives on the "db-store" GitHub Release, not in git: it
      # passed git's 100 MiB per-file limit on 2026-10-06. See scripts/db_store.sh.
      - name: Download database
        run: bash scripts/db_store.sh pull

      - name: Run pipeline
        run: python3 main.py --window-hours 72 --per-source-cap 8

      # Upload before committing the report, so a failed upload fails the run
      # and the published report never runs ahead of the stored database.
      - name: Upload database
        run: bash scripts/db_store.sh push

      - name: Copy report for GitHub Pages
        run: cp scoop_report.html index.html

      - name: Timestamp for commit message
        run: echo "RUN_TS=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"

      - name: Commit results
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Scoop tracker run: ${{ env.RUN_TS }}"
          file_pattern: "scoop_report.html scoop_tracker_output.json index.html"
          commit_user_name: "scoop-tracker-bot"
          commit_user_email: "actions@users.noreply.github.com"
