name: Scoop Tracker report checks

on:
  push:
    branches:
      - ux/investigative-triage
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  report-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m py_compile main.py db.py

      - name: Check browser script syntax
        run: node --check assets/report.js

      - name: Test generated report
        run: python -m unittest discover -s tests -v
